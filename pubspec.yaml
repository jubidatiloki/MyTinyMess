name: my_tiny_mess
description: "Gérer sa bibliothèque et sa cave à vin."
publish_to: 'none'
version: 0.16.0+17

environment:
  sdk: ^3.10.4

dependencies:
  app_links: ^7.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  mobile_scanner: ^7.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sembast: ^3.8.6
  sembast_web: ^2.4.4+1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/

# Icône de l'application (dessin : lib/widgets/icone_app.dart).
# Régénérer : flutter test outils/generer_icones_test.dart
#             puis dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icone/icone.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#4A9D60"
  adaptive_icon_foreground: "assets/icone/icone_premier_plan.png"
  web:
    generate: true
    image_path: "assets/icone/icone.png"
    background_color: "#262827"
    theme_color: "#4A9D60"
  windows:
    generate: true
    image_path: "assets/icone/icone.png"
    icon_size: 256
